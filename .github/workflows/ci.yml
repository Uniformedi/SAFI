name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` here. It needs a requirements.txt or pyproject.toml
          # to hash, and this repo deliberately has neither -- it ships four
          # drop-in files, not a package. Enabling the cache fails the job
          # before any step runs. Two dependencies install in seconds anyway.

      # anthropic is required, not optional. The benchmark checks the gate's
      # outgoing request against the installed SDK's messages.create signature;
      # without the SDK that case cannot run and reports itself as a failure
      # rather than passing quietly. Installing it is what makes the run mean
      # something.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff is PINNED. Unpinned, the rule set is whatever the newest
          # release defaults to -- 0.16 added BLE001/PLE2502/PLE2515 to its
          # defaults and turned a green lint red with no code change. The
          # pin fixes which ruff runs; ruff.toml fixes which rules it applies.
          pip install anthropic 'ruff==0.16.7'

      - name: Lint
        run: ruff check .

      - name: Benchmark (offline)
        # No ANTHROPIC_API_KEY in CI, so Layer 2 runs in REPLAY. Sections A, C
        # and D are fully deterministic and are the ones this gate is graded
        # on here. The live Layer 2 result is recorded in the README and has to
        # be reproduced by hand with a key set -- CI does not prove it.
        run: python run_safi_benchmark.py --offline
