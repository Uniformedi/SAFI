name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` here. It needs a requirements.txt or pyproject.toml
          # to hash, and this repo deliberately has neither -- it ships four
          # drop-in files, not a package. Enabling the cache fails the job
          # before any step runs. Two dependencies install in seconds anyway.

      # anthropic is required, not optional. The benchmark checks the gate's
      # outgoing request against the installed SDK's messages.create signature;
      # without the SDK that case cannot run and reports itself as a failure
      # rather than passing quietly. Installing it is what makes the run mean
      # something.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # ruff is PINNED. Unpinned, the rule set is whatever the newest
          # release defaults to -- 0.16 added BLE001/PLE2502/PLE2515 to its
          # defaults and turned a green lint red with no code change. The
          # pin fixes which ruff runs; ruff.toml fixes which rules it applies.
          pip install anthropic 'ruff==0.16.7'
          # The reference implementation of SAIVAS. The conformance suite
          # imports and RUNS it rather than restating its rules, so this
          # install is what makes that comparison real. Not on PyPI.
          pip install 'git+https://github.com/Uniformedi/humility-guardrail@main'

      - name: Lint
        run: ruff check .

      - name: Benchmark (offline)
        # No ANTHROPIC_API_KEY in CI, so Layer 2 runs in REPLAY. Sections A, C
        # and D are fully deterministic and are the ones this gate is graded
        # on here. The live Layer 2 result is recorded in the README and has to
        # be reproduced by hand with a key set -- CI does not prove it.
        run: python run_safi_benchmark.py --offline

      - name: SAIVAS conformance
        # Compares SAFi Layer 3 against the reference implementation. Exits
        # non-zero if the reference is missing -- there is nothing to conform
        # to in that state, and a pass would be asserting an unchecked claim.
        run: python run_saivas_conformance.py

      - name: False positives
        # A ratchet, not a target. 3.3 is just above the rate measured when
        # this step was added (3.2%, 5/155); the remaining five are reads of
        # documentation and directory listings that mention a blocked command
        # without running it. Lower the number when the rate drops; raising it
        # should take an argument, because it means the gate started refusing
        # more ordinary work.
        run: python run_safi_false_positives.py --max-rate 3.3

      - name: Latency (offline layers)
        # Not a gate -- CI timing is too noisy to assert on. It runs so the
        # harness itself cannot rot unnoticed.
        run: python run_safi_latency.py
